<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Call Board — Audition Tracker</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="cb-root">
  <div class="cb-header">
    <div>
      <div class="cb-title">Audition Tracker</div>
      <div class="cb-sub">mk productions</div>
    </div>
    <div class="cb-header-actions" id="cb-header-actions">
      <!-- filled in by app.js depending on logged in/out state -->
    </div>
  </div>

  <div class="cb-status-line" id="cb-status"></div>

  <div id="cb-auth-screen"></div>

  <div id="cb-app-screen" style="display:none;">
    <div class="cb-stats" id="cb-stats"></div>
    <div class="cb-tabs" id="cb-type-tabs"></div>
    <div class="cb-tabs" id="cb-status-tabs"></div>
    <div class="cb-view-row">
      <div class="cb-tabs cb-view-tabs" id="cb-view-tabs"></div>
      <select class="cb-sort-select" id="cb-sort-select"></select>
    </div>
    <div class="cb-grid" id="cb-grid"></div>
    <div class="cb-week-view" id="cb-week-view" style="display:none;"></div>
  </div>
</div>

<div id="cb-modal-container"></div>

<script src="app.js"></script>
</body>
</html>
